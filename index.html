<!DOCTYPE html>
<html lang="ku">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Siso AI Pro - Puter.js Edition</title>
    <script src="https://js.puter.com/v2/"></script>
    <style>
        :root { --primary: #007bff; --secondary: #6c757d; --dark: #1f2937; --light: #f9fafb; }
        body { font-family: 'Segoe UI', sans-serif; direction: rtl; background: var(--light); margin: 0; padding: 20px; color: var(--dark); }
        .container { max-width: 800px; margin: auto; background: white; padding: 30px; border-radius: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.1); }
        h1 { color: var(--primary); font-size: 2rem; margin-bottom: 10px; }
        .badge { background: #e1effe; color: #1e429f; padding: 5px 12px; border-radius: 20px; font-size: 12px; font-weight: bold; }
        
        .tab-container { display: flex; gap: 10px; margin: 20px 0; border-bottom: 2px solid #eee; padding-bottom: 10px; }
        .tab { cursor: pointer; padding: 10px 20px; border-radius: 8px; transition: 0.3s; font-weight: bold; }
        .tab.active { background: var(--primary); color: white; }

        input, textarea { width: 100%; padding: 15px; border: 2px solid #eee; border-radius: 12px; margin: 10px 0; box-sizing: border-box; font-size: 16px; outline: none; }
        button { width: 100%; padding: 15px; background: var(--primary); color: white; border: none; border-radius: 12px; font-size: 18px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        button:hover { background: #0056b3; transform: translateY(-2px); }

        #output { margin-top: 25px; padding: 20px; background: #fff; border: 1px solid #eee; border-radius: 12px; min-height: 100px; text-align: right; white-space: pre-wrap; position: relative; }
        .img-result { max-width: 100%; border-radius: 12px; margin-top: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .loading { color: var(--primary); font-weight: bold; display: none; }
    </style>
</head>
<body>

<div class="container">
    <h1>🤖 Siso AI Pro <span class="badge">V1.0 (No-Key)</span></h1>
    <p>بکارئینانا هێزا GPT-5 و Gemini ب بێ کلیلەکا نهێنی</p>

    <div class="tab-container">
        <div id="chatTab" class="tab active" onclick="switchMode('chat')">💬 چات (Text)</div>
        <div id="imageTab" class="tab" onclick="switchMode('image')">🎨 وێنە (Image)</div>
    </div>

    <div id="inputSection">
        <textarea id="userInput" rows="3" placeholder="لێرە بنڤیسە..."></textarea>
        <button id="actionBtn" onclick="process()">دەستپێبکە 🚀</button>
    </div>

    <div id="loading" class="loading">ل چاڤەڕێ بن، AI یێ کار دکەت... ⏳
