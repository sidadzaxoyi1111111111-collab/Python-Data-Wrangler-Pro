<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sidad Tech - AI</title>
    <script src="https://js.puter.com/v2/"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f4f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .chat-container { width: 100%; max-width: 500px; background: white; padding: 20px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); border: 2px solid #3498db; }
        h1 { color: #2c3e50; text-align: center; font-size: 24px; margin-bottom: 10px; }
        #chat-box { height: 350px; overflow-y: auto; border: 1px solid #ddd; padding: 10px; margin-bottom: 15px; border-radius: 10px; background: #fafafa; display: flex; flex-direction: column; gap: 10px; }
        .input-area { display: flex; gap: 8px; }
        input { flex: 1; padding: 12px; border: 2px solid #eee; border-radius: 25px; outline: none; transition: 0.3s; }
        input:focus { border-color: #3498db; }
        button { padding: 10px 18px; border: none; border-radius: 25px; cursor: pointer; transition: 0.3s; font-weight: bold; font-size: 18px; }
        .btn-chat { background-color: #3498db; color: white; }
        .btn-img { background-color: #2ecc71; color: white; }
        .footer { text-align: center; margin-top: 15px; font-size: 11px; color: #7f8c8d; }
        img { max-width: 100%; border-radius: 10px; margin-top: 10px; border: 1px solid #ddd; }
    </style>
</head>
<body>

<div class="chat-container">
    <h1>🤖 Sidad Tech</h1>
    <p style="text-align: center; font-size: 12px; color: #34495e; margin-bottom: 15px;">زاخۆ - دهۆک AI سیستم</p>
    
    <div id="chat-box"></div>

    <div class="input-area">
        <input type="text" id="user-input" placeholder="پرسیارەکێ ب بادینی بکە...">
        <button class="btn-chat" title="چات" onclick="sendMessage()">💬</button>
        <button class="btn-img" title="وێنە" onclick="generateImage()">🎨</button>
    </div>

    <div class="footer">گەشەپێدان: Sedad Ahmad | Siso0o</div>
</div>

<script>
    // ئەڤ بەشە دێ پشت ڕاست بیت کا پوتەر یێ کارایە یان نە
    async function sendMessage() {
        const input = document.getElementById('user-input');
        const box = document.getElementById('chat-box');
        const text = input.value.trim();
        
        if (!text) return;

        box.innerHTML += `<div style="text-align: right; background: #e1f5fe; padding: 8px; border-radius: 10px; align-self: flex-start;"><b>تۆ:</b> ${text}</div>`;
        input.value = '';
        box.scrollTop = box.scrollHeight;

        try {
            // فەرمانا چاتی دگەل مۆدێلێ بادینی
            const response = await puter.ai.chat(
                `تۆ یاریدەدەرێکی زیرەکی ب ناڤێ "Sidad Tech". 
                دڤێت تەنێ ب زمانێ کوردی شێوەزارێ بادینی (زاخۆ و دهۆک) بەرسڤێ بدەی. 
                بەرسڤێن تە با بلا کورت و ب مفابن.`, 
                text
            );
            box.innerHTML += `<div style="text-align: left; background: #f1f1f1; padding: 8px; border-radius: 10px; align-self: flex-end; color: #2c3e50;"><b>Sidad Tech:</b> ${response}</div>`;
        } catch (err) {
            console.error("Error Details:", err);
            box.innerHTML += `<div style="color: red; font-size: 12px; text-align: center;">⚠️ کێشەیەک د پەیوەندیێ دا هەبوو. هیڤییە لاپەرەی "Refresh" بکە یان دوبارە Login ببە.</div>`;
        }
        box.scrollTop = box.scrollHeight;
    }

    async function generateImage() {
        const input = document.getElementById('user-input');
        const box = document.getElementById('chat-box');
        const text = input.value.trim();
        
        if (!text) return;

        box.innerHTML += `<div style="text-align: center; color: #7f8c8d;">⌛ چاڤەڕێ بە، وێنە دهێتە دروستکرن...</div>`;
        
        try {
            // پوتەر پێدڤی ب فەرمانا ئینگلیزی هەیە بۆ وێنەیان
            const img = await puter.ai.txt2img(text);
            const imgElement = document.createElement('img');
            imgElement.src = img.src;
            box.appendChild(imgElement);
        } catch (err) {
            box.innerHTML += `<div style="color: red; font-size: 12px; text-align: center;">❌ نەشێم وێنەی دروست کەم. دوبارە تاقی بکە.</div>`;
        }
        input.value = '';
        box.scrollTop = box.scrollHeight;
    }
</script>

</body>
</html>
