<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sidad Tech - AI</title>
    <script src="https://js.puter.com/v2/"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f4f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .chat-container { width: 100%; max-width: 500px; background: white; padding: 20px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        h1 { color: #2c3e50; text-align: center; font-size: 24px; margin-bottom: 20px; }
        #chat-box { height: 300px; overflow-y: auto; border: 1px solid #ddd; padding: 10px; margin-bottom: 15px; border-radius: 10px; background: #fafafa; display: flex; flex-direction: column; }
        .input-area { display: flex; gap: 10px; }
        input { flex: 1; padding: 12px; border: 1px solid #ccc; border-radius: 25px; outline: none; }
        button { padding: 10px 20px; border: none; border-radius: 25px; cursor: pointer; transition: 0.3s; font-weight: bold; }
        .btn-chat { background-color: #3498db; color: white; }
        .btn-img { background-color: #2ecc71; color: white; }
        .footer { text-align: center; margin-top: 15px; font-size: 12px; color: #7f8c8d; }
    </style>
</head>
<body>

<div class="chat-container">
    <h1>🤖 Sidad Tech</h1>
    <p style="text-align: center; font-size: 14px; color: #666;">پوتەر ئای ئای ب شێوەزارێ بادینی</p>
    
    <div id="chat-box"></div>

    <div class="input-area">
        <input type="text" id="user-input" placeholder="تشتەکێ بنڤیسە...">
        <button class="btn-chat" onclick="sendMessage()">💬</button>
        <button class="btn-img" onclick="generateImage()">🎨</button>
    </div>

    <div class="footer">گێشەپێدان: Sedad Ahmad | Siso0o</div>
</div>

<script>
    async function sendMessage() {
        const input = document.getElementById('user-input');
        const box = document.getElementById('chat-box');
        if (!input.value) return;

        box.innerHTML += `<div><b>تۆ:</b> ${input.value}</div>`;
        const userInput = input.value;
        input.value = '';

        try {
            // ئەڤە لایێ گرنگە بۆ بادینی ئاخفتنێ
            const response = await puter.ai.chat(
                `تۆ یاریدەدەرێکی زیرەکی ب ناڤێ "Sidad Tech". 
                دڤێت تەنێ ب زمانێ کوردی شێوەزارێ بادینی بەرسڤێ بدەی. 
                هەمی بەرسڤێن تە با بلا ب شێوەیێ (ئەز، من، تە، هاتی، چۆیی) بن وەک خەلکێ زاخۆ و دهۆکێ.`, 
                userInput
            );
            box.innerHTML += `<div style="color: #2980b9; margin-top: 5px;"><b>Sidad Tech:</b> ${response}</div>`;
        } catch (err) {
            box.innerHTML += `<div style="color: red;">کێشەیەک چێبوو!</div>`;
        }
        box.scrollTop = box.scrollHeight;
    }

    async function generateImage() {
        const input = document.getElementById('user-input');
        const box = document.getElementById('chat-box');
        if (!input.value) return;

        box.innerHTML += `<div><b>تۆ:</b> داخوازا وێنەی دکەی...</div>`;
        try {
            const img = await puter.ai.txt2img(input.value);
            box.appendChild(img);
        } catch (err) {
            box.innerHTML += `<div style="color: red;">کێشە د وێنەی دا هەیە!</div>`;
        }
        input.value = '';
        box.scrollTop = box.scrollHeight;
    }
</script>

</body>
</html>
